name: Deploy

on:
  push:
    branches: [ main ]

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Cache Nix input downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/nix
          key: ${{ runner.os }}-nix-${{ hashFiles('flake.lock') }}

      # A unique save key lets repaired/partial caches persist even for the
      # same ref set; restore first prefers that ref set, then older ref sets.
      - name: Restore gallery metadata
        id: gallery-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: target/gallery-metadata/metadata.json
          key: ${{ runner.os }}-gallery-metadata-${{ hashFiles('tools/gallery_metadata.py', 'flake.lock') }}-${{ hashFiles('.shadow/refs/gallery/**/*.ref', 'shadow.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-gallery-metadata-${{ hashFiles('tools/gallery_metadata.py', 'flake.lock') }}-${{ hashFiles('.shadow/refs/gallery/**/*.ref', 'shadow.toml') }}-
            ${{ runner.os }}-gallery-metadata-${{ hashFiles('tools/gallery_metadata.py', 'flake.lock') }}-

      # Only missing object hashes are downloaded from public TOS and fully
      # verified. Warm builds need neither original photos nor TOS credentials.
      - name: Build Notist site
        run: nix --max-jobs 1 --cores 2 develop --no-update-lock-file --command just build

      - name: Validate generated site
        run: nix --max-jobs 1 --cores 2 develop --no-update-lock-file --command just check

      - name: Save gallery metadata
        if: ${{ always() && steps.gallery-cache.outputs.cache-primary-key != '' && hashFiles('target/gallery-metadata/metadata.json') != '' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: target/gallery-metadata/metadata.json
          key: ${{ steps.gallery-cache.outputs.cache-primary-key }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './target/notist-site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
